name: mylanguageapp
description: "Learning a language app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_tts: ^4.2.5
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  intl: ^0.20.3
  flutter_sequence_animation: ^4.0.0
  permission_handler: ^13.0.2
  device_info_plus: ^13.3.0
  file_picker: ^13.3.2
  audioplayers: ^6.8.1
  provider: ^6.1.5+1
  flutter_typeahead: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  advanced_searchable_dropdown: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/audios/
    - assets/json/
